name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.13.1'
          cache: npm
      - name: Require release metadata before installation
        id: mode
        run: node scripts/ci-mode.mjs
      - run: npm ci --ignore-scripts
      - run: node node_modules/typescript/bin/tsc --project tsconfig.json
        if: steps.mode.outputs.release == 'false'
      - run: npx eslint .
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
        env:
          BROWSERS: chromium,firefox,webkit
      - run: node scripts/check-release.mjs
        if: steps.mode.outputs.release == 'true'
