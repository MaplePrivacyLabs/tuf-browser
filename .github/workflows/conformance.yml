# .github/workflows/conformance.yml
name: tuf-conformance

on:
  push:
    branches: [main, 'maple/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tuf-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Require release metadata before installation
        id: mode
        run: node scripts/ci-mode.mjs
      - run: npm ci
        if: steps.mode.outputs.release == 'false'
      - run: npm ci --ignore-scripts
        if: steps.mode.outputs.release == 'true'
      - run: node node_modules/typescript/bin/tsc --project tsconfig.json
        if: steps.mode.outputs.release == 'false'
      - run: chmod +x dist/cli.js
      - run: cp cli.js.xfails dist/

      - uses: theupdateframework/tuf-conformance@1bc18916ee35f753b6eb8ee19dabb98449ca7326
        with:
          entrypoint: dist/cli.js

